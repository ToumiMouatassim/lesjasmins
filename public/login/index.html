<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register</title>
  <link rel="stylesheet" href="/login/style.css">
</head>
<body>
  <div class="container right-panel-active">
    <!-- Sign Up -->
    <div class="container__form container--signup">
      <form class="form" id="form1">
        <h2 class="form__title">S'inscrire</h2>
        <input type="text" placeholder="Nom complet" class="input" required />
        <input type="email" placeholder="Email" class="input" required />
        <input type="password" placeholder="Mot de passe" class="input" required />
        <select required class="input">
          <option value="">Sélectionnez votre rôle</option>
          <option value="patient">Patient</option>
          <option value="medecin">Médecin</option>
          <option value="admin">Admin</option>
        </select>
        <button class="btn">S'inscrire</button>
      </form>
    </div>

    <!-- Sign In -->
    <div class="container__form container--signin">
      <form class="form" id="form2">
        <h2 class="form__title">Se connecter</h2>
        <input type="email" placeholder="Email" class="input" required />
        <input type="password" placeholder="Mot de passe" class="input" required />
        <a href="#" class="link">Mot de passe oublié ?</a>
        <button class="btn">Se connecter</button>
      </form>
    </div>

    <!-- Overlay -->
    <div class="container__overlay">
      <div class="overlay">
        <div class="overlay__panel overlay--left">
          <button class="btn" id="signIn">Se connecter</button>
        </div>
        <div class="overlay__panel overlay--right">
          <button class="btn" id="signUp">S'inscrire</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/login/main.js"></script>
</body>
</html>
